name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies (bun — bun.lock is the source of truth)
        run: bun install --frozen-lockfile

      - name: Prisma generate
        run: bunx prisma generate

      - name: Fresh database (guards SSG against real-db queries)
        run: bunx prisma db push --skip-generate
        env:
          DATABASE_URL: "file:./ci.db"

      - name: Next typegen (next-env.d.ts is gitignored)
        run: bunx next typegen

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Lint
        run: bunx eslint src/

      - name: Build
        run: bun run build
        env:
          DATABASE_URL: "file:./ci.db"
